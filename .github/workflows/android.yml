name: Build SoundWave Android Zip

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate ZIP
        run: |
          test -f SoundWave-Android-Premium-Music-App.zip
          file SoundWave-Android-Premium-Music-App.zip
          unzip -t SoundWave-Android-Premium-Music-App.zip

      - name: Extract project
        run: |
          mkdir -p SoundWave
          bsdtar -xf SoundWave-Android-Premium-Music-App.zip
          test -d SoundWave

      - name: Build app
        working-directory: SoundWave
        run: gradle build assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: SoundWave/app/build/outputs/apk/debug/app-debug.apk
