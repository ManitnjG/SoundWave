name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Build debug APK only
        working-directory: SoundWave
        run: gradle :app:clean :app:assembleDebug --no-daemon --warning-mode all -x :app:processBenchmarkResources -x :app:mergeBenchmarkNativeLibs

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: SoundWave/app/build/outputs/apk/debug/app-debug.apk
