name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Add fallback launcher icons for CI
        working-directory: SoundWave
        run: |
          mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable app/src/main/res/values
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF2'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF2
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF2'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF2
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF2'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M18,18h72v72h-72z"/>
          </vector>
          EOF2

      - name: Build debug APK and print focused diagnostics on failure
        working-directory: SoundWave
        shell: bash
        run: |
          set +e
          gradle :app:clean :app:assembleDebug :app:kspDebugKotlin --no-daemon --warning-mode all --stacktrace 2>&1 | tee build.log
          build_exit=${PIPESTATUS[0]}
          if [ $build_exit -ne 0 ]; then
            echo "\nFocused error lines:" 
            grep -E "error:|caused by|exception" -i -A 5 build.log || true
          fi
          exit $build_exit

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: SoundWave/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: SoundWave/build.log
